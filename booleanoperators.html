<!--
boolean operations are used to compare values
= -> assignment operator
> -> greater than
< - less than
>= -> greater than or equal
<= -> less than or equal
== -> equal sign
=== -> congruence sign
! -> "not" operator sign
!= -> not equal to
 -->
<script>
    var vol1 = 7;
    var vol2 = 20;

    if (!(vol1 == vol2)) {
        console.log("equal to");
    }else{
        console.log("not equal to");
    }
    if (!(vol1 > vol2)) {
        console.log("greater than");
    }else{
        console.log("not greater than");
    }
    if (!(vol1 < vol2)) {
        console.log("less than");
    }else{
        console.log("not less than");
    }
    if (!(vol1 >= vol2)) {
        console.log("greater than or equal to");
    }else{
        console.log("not greater than or equal to");
    }
    if (!(vol1 <= vol2)) {
        console.log("less than or equal to");
    }else{
        console.log("not less than or equal to");
    }
    if (!(vol1 === vol2)) {
        console.log("congruent to");
    }else{
        console.log("not congruent to");
    }
    if (!(vol1 != vol2)) {
        console.log("not equal to");
    }else{
        console.log("equal to");
    }
</script>
