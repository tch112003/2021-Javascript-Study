<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>onclick</title>

    <script type="text/javascript">
    function turnblue() {
        document.getElementById("example").style.color = "blue";
        document.getElementById("example").textContent = "goodbye";
    }
    </script>

</head>
<body>

<button type="button" onClick="turnblue()">blue</button>

<div id="example">stick some text inside of it</div>
</body>
</html>
